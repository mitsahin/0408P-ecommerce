services:
  - type: web
    name: 0408p-ecommerce-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm install --prefix backend
    startCommand: npm run server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SEED_API_URL
        value: https://workintech-fe-ecommerce.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString

databases:
  - name: ecommerce-db
    databaseName: ecommerce
    user: ecommerce
    plan: free
